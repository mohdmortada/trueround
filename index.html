<style>
:root {

  --ink: #0f1214;
  --ink-muted: #565c62;
  --ink-faint: #8a9096;
  --on-ink: #ffffff;
  --gold: #7d5e0f;
  --gold-soft: #f5ebcf;
  --gold-mark: #b8891a;
  --corner-red: #c8202f;
  --corner-red-soft: #fbe3e5;
  --corner-blue: #1f4fd1;
  --corner-blue-soft: #e2e9fb;
  --cleared: #1e7a46;
  --cleared-soft: #dff2e6;
  --caution: #995a00;
  --caution-soft: #fbebd3;
  --stop: #9b1c45;
  --stop-soft: #f8e1e8;
  --focus-ring: var(--corner-blue);
  --shadow-sm: 0 1px 2px #0f12140f;
  --shadow-lg: 0 12px 32px #0f12141f, 0 2px 6px #0f121414;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;
  --space-16: 64px;
  --radius-xs: 2px;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-full: 9999px;
  --stroke-hairline: 1px;
  --stroke-rule: 2px;
  --stroke-heavy: 4px;
  --font-display: "Archivo", "Arial Black", system-ui, sans-serif;
  --font-sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

/* TrueRound components. Every colour, space and radius is a token from tokens.css. */
body { margin: 0; font-family: var(--font-sans); font-size: 16px; line-height: 24px; background: var(--canvas); color: var(--ink); -webkit-font-smoothing: antialiased; }
.tr-display { font-family: var(--font-display); font-stretch: 125%; text-transform: uppercase; }
.tr-label { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); }
.tr-row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; padding: var(--space-4); }
.tr-stack { display: grid; gap: var(--space-4); padding: var(--space-4); }
.tr-icon { flex: none; display: block; }

/* Button */
.tr-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); font: inherit; font-size: 15px; font-weight: 600; height: 44px; padding: 0 var(--space-5); border-radius: var(--radius-sm); border: var(--stroke-hairline) solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; transition: background .15s ease-out, transform .1s ease-out; }
.tr-btn:hover { background: var(--surface-sunken); }
.tr-btn:active { transform: scale(.98); }
.tr-btn:focus-visible, .tr-switch:focus-visible, .tr-nav-item:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--canvas), 0 0 0 4px var(--focus-ring); }
.tr-btn:disabled { cursor: not-allowed; opacity: .45; transform: none; }
.tr-btn-primary { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.tr-btn-primary:hover { background: var(--ink); opacity: .88; }
.tr-btn-quiet { background: transparent; border-color: transparent; color: var(--ink); }
.tr-btn-danger { background: var(--surface); border-color: var(--stop); color: var(--stop); }
.tr-btn-sm { height: 40px; font-size: 14px; padding: 0 var(--space-4); }
.tr-btn-block { width: 100%; }

/* Badge */
.tr-badge { display: inline-flex; align-items: center; gap: var(--space-1); font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.04em; padding: 4px var(--space-2); border-radius: var(--radius-sm); background: var(--surface-sunken); color: var(--ink-muted); white-space: nowrap; }
.tr-badge-verified { background: var(--gold-soft); color: var(--gold); }
.tr-badge-pending { background: var(--caution-soft); color: var(--caution); }
.tr-badge-cleared { background: var(--cleared-soft); color: var(--cleared); }
.tr-badge-suspended { background: var(--stop-soft); color: var(--stop); }

/* Corner tag */
.tr-corner { display: inline-flex; align-items: center; gap: var(--space-2); font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
.tr-corner-dot { width: 10px; height: 10px; border-radius: var(--radius-full); background: currentColor; }
.tr-corner-red { color: var(--corner-red); }
.tr-corner-blue { color: var(--corner-blue); }

/* Scorecard */
.tr-scorecard { margin: 0; background: var(--surface); border: var(--stroke-hairline) solid var(--line); border-radius: var(--radius-md); overflow: hidden; font-variant-numeric: tabular-nums; }
.tr-sc-corners { display: grid; grid-template-columns: 1fr 1fr; }
.tr-sc-fighter { display: grid; gap: var(--space-1); padding: var(--space-3) var(--space-4); border-top: var(--stroke-heavy) solid; min-width: 0; }
.tr-sc-fighter strong { font-family: var(--font-display); font-stretch: 112%; text-transform: uppercase; font-size: 15px; line-height: 20px; overflow-wrap: anywhere; }
.tr-sc-fighter-red { border-color: var(--corner-red); }
.tr-sc-fighter-blue { border-color: var(--corner-blue); text-align: right; justify-items: end; }
.tr-sc-table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 14px; }
.tr-sc-table th, .tr-sc-table td { padding: var(--space-2) var(--space-3); text-align: center; border-top: var(--stroke-hairline) solid var(--line); }
.tr-sc-table thead th { font-family: var(--font-sans); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); background: var(--surface-sunken); border-bottom: var(--stroke-rule) solid var(--rule); }
.tr-sc-table tbody th { font-weight: 500; color: var(--ink-muted); }
.tr-sc-total { font-weight: 600; border-left: var(--stroke-rule) solid var(--rule); }
.tr-sc-red { color: var(--corner-red); }
.tr-sc-blue { color: var(--corner-blue); }
.tr-sc-sep { color: var(--ink-faint); padding: 0 2px; }
.tr-sc-result { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-3); align-items: center; padding: var(--space-3) var(--space-4); border-top: var(--stroke-rule) solid var(--rule); font-size: 14px; line-height: 20px; }

/* Record */
.tr-record { display: inline-grid; gap: 2px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.tr-record-num { font-size: 40px; line-height: 40px; font-weight: 600; letter-spacing: -0.02em; }
.tr-record-key { display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; letter-spacing: .12em; color: var(--ink-muted); }
.tr-record-sm .tr-record-num { font-size: 20px; line-height: 24px; }

/* Level ladder */
.tr-ladder { list-style: none; margin: 0; padding: 0; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: var(--space-1); container-type: inline-size; }
@container (max-width: 520px) { .tr-ladder-name { visibility: hidden; white-space: nowrap; } .tr-ladder-current .tr-ladder-name { visibility: visible; } .tr-ladder-step:last-child.tr-ladder-current .tr-ladder-name { text-align: right; } }
.tr-ladder-step { display: grid; gap: var(--space-2); min-width: 0; }
.tr-ladder-bar { height: 8px; border-radius: var(--radius-xs); background: var(--surface-sunken); }
.tr-ladder-done .tr-ladder-bar { background: var(--ink); }
.tr-ladder-current .tr-ladder-bar { background: var(--gold-mark); }
.tr-ladder-name { font-size: 11px; line-height: 14px; font-weight: 600; color: var(--ink-muted); hyphens: auto; }
.tr-ladder-current .tr-ladder-name { color: var(--ink); }

/* Skill meter */
.tr-skill { display: grid; gap: var(--space-2); }
.tr-skill-head { display: flex; justify-content: space-between; gap: var(--space-3); font-size: 15px; line-height: 20px; }
.tr-skill-name { font-weight: 600; min-width: 0; }
.tr-skill-value { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--ink-muted); }
.tr-skill-meter { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
.tr-skill-meter span { height: 10px; border-radius: var(--radius-xs); background: var(--surface-sunken); }
.tr-skill-meter span.on { background: var(--ink); }
.tr-skill-meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); font-size: 13px; line-height: 18px; color: var(--ink-muted); }

/* Clearance card */
.tr-clear { background: var(--surface); border: var(--stroke-hairline) solid var(--line); border-radius: var(--radius-md); overflow: hidden; }
.tr-clear-band { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-4); font-weight: 600; }
.tr-clear-cleared .tr-clear-band { background: var(--cleared-soft); color: var(--cleared); }
.tr-clear-pending .tr-clear-band { background: var(--caution-soft); color: var(--caution); }
.tr-clear-suspended .tr-clear-band { background: var(--stop-soft); color: var(--stop); }
.tr-clear-body { display: grid; gap: var(--space-2); padding: var(--space-3) var(--space-4) var(--space-4); }
.tr-clear-until { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); flex-wrap: wrap; }
.tr-clear-date { font-family: var(--font-mono); font-size: 20px; line-height: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tr-clear-meta { font-size: 13px; line-height: 18px; color: var(--ink-muted); }

/* Athlete card */
.tr-athlete { display: grid; gap: var(--space-4); padding: var(--space-5); background: var(--surface); border: var(--stroke-hairline) solid var(--line); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); }
.tr-athlete-red { border-top: var(--stroke-heavy) solid var(--corner-red); }
.tr-athlete-blue { border-top: var(--stroke-heavy) solid var(--corner-blue); }
.tr-athlete-top { display: flex; gap: var(--space-4); align-items: center; min-width: 0; }
.tr-avatar { flex: none; width: 56px; height: 56px; border-radius: var(--radius-full); display: grid; place-items: center; background: var(--ink); color: var(--on-ink); font-family: var(--font-display); font-stretch: 125%; font-weight: 800; font-size: 18px; }
.tr-athlete-id { display: grid; gap: var(--space-1); justify-items: start; min-width: 0; }
.tr-athlete-name { margin: 0; font-family: var(--font-display); font-stretch: 125%; font-weight: 900; text-transform: uppercase; font-size: 24px; line-height: 26px; overflow-wrap: anywhere; }
.tr-athlete-sub { margin: 0; font-size: 14px; line-height: 20px; color: var(--ink-muted); }
.tr-athlete-stats { display: flex; flex-wrap: wrap; gap: var(--space-6); align-items: end; justify-content: space-between; padding-top: var(--space-4); border-top: var(--stroke-hairline) solid var(--line); }
.tr-athlete-dl { display: flex; gap: var(--space-5); margin: 0; }
.tr-athlete-dl div { display: grid; gap: 2px; }
.tr-athlete-dl dt { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
.tr-athlete-dl dd { margin: 0; font-family: var(--font-mono); font-size: 15px; font-weight: 600; }
.tr-athlete-foot { font-size: 13px; line-height: 18px; color: var(--ink-muted); }

/* Field */
.tr-field { display: grid; gap: var(--space-1); }
.tr-field label { font-size: 14px; line-height: 20px; font-weight: 600; }
.tr-field input, .tr-field select { font: inherit; height: 44px; padding: 0 var(--space-3); border-radius: var(--radius-sm); border: var(--stroke-hairline) solid var(--line); background: var(--surface); color: var(--ink); }
.tr-field input:focus, .tr-field select:focus { outline: none; border-color: var(--focus-ring); box-shadow: 0 0 0 1px var(--focus-ring); }
.tr-field-hint { margin: 0; font-size: 13px; line-height: 18px; color: var(--ink-muted); }
.tr-field-error input { border-color: var(--stop); }
.tr-field-error .tr-field-hint { color: var(--stop); }

/* Toggle */
.tr-toggle { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); padding: var(--space-3) 0; }
.tr-toggle-text { display: grid; gap: 2px; min-width: 0; }
.tr-toggle-text label { font-weight: 600; font-size: 15px; line-height: 20px; }
.tr-toggle-text p { margin: 0; font-size: 13px; line-height: 18px; color: var(--ink-muted); }
.tr-switch { flex: none; position: relative; width: 48px; height: 28px; border-radius: var(--radius-full); border: 0; background: var(--line); cursor: pointer; padding: 0; transition: background .15s ease-out; }
.tr-switch[aria-checked="true"] { background: var(--ink); }
.tr-switch-knob { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: var(--radius-full); background: var(--surface); transition: transform .15s ease-out; }
.tr-switch[aria-checked="true"] .tr-switch-knob { transform: translateX(20px); }
.tr-switch:disabled { cursor: not-allowed; opacity: .5; }

/* Bottom nav */
.tr-nav { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface); border-top: var(--stroke-hairline) solid var(--line); }
.tr-nav-item { position: relative; display: grid; justify-items: center; align-content: center; gap: 2px; min-height: 56px; padding: var(--space-2) 0 var(--space-2); border: 0; background: none; font: inherit; font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: .04em; color: var(--ink-muted); cursor: pointer; }
.tr-nav-item.is-active { color: var(--ink); }
.tr-nav-item.is-active::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; background: var(--ink); }
.tr-nav-dot { position: absolute; top: 6px; left: calc(50% + 8px); width: 8px; height: 8px; border-radius: var(--radius-full); background: var(--gold-mark); }

/* Motion: the record reveals itself once, on mount. Scores tick in round by round, meters fill
   segment by segment, the current level draws in. Nothing loops, and nothing moves under reduced motion. */
@keyframes tr-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes tr-fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.tr-skill-meter span.on { transform-origin: left center; animation: tr-fill .28s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 35ms); }
.tr-ladder-current .tr-ladder-bar { transform-origin: left center; animation: tr-fill .45s cubic-bezier(.2, .8, .2, 1) .15s both; }
.tr-sc-table tbody td { animation: tr-rise .26s ease-out both; animation-delay: calc(120ms + var(--i, 0) * 55ms); }
.tr-sc-result { animation: tr-rise .3s ease-out .9s both; }
.tr-nav-item.is-active::before { animation: tr-fill .2s ease-out both; }

@media (prefers-reduced-motion: reduce) {
  .tr-btn, .tr-switch, .tr-switch-knob { transition: none; }
  .tr-skill-meter span.on, .tr-ladder-current .tr-ladder-bar, .tr-sc-table tbody td, .tr-sc-result, .tr-nav-item.is-active::before { animation: none; }
}

/* TrueRound app layout. Layout concept: a demo bar over one stage; athletes get a phone-width column, coaches and officials a portal. */
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--canvas); color: var(--ink); }
button { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
.muted { color: var(--ink-muted); }
.small { font-size: 14px; line-height: 20px; }
.data, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 13px; }
.mono { font-size: 14px; font-weight: 600; }
.title { font-size: 18px; line-height: 26px; font-weight: 600; }
.headline { font-family: var(--font-display); font-stretch: 125%; font-weight: 800; text-transform: uppercase; font-size: 20px; line-height: 24px; overflow-wrap: anywhere; }
.scr-title { font-weight: 900; font-size: 32px; line-height: 32px; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.stack { display: grid; gap: var(--space-4); }
.row-between { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: var(--space-3); }
.btn-row { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
.link-btn { display: inline-flex; align-items: center; min-height: 44px; border: 0; background: none; padding: 0; font-weight: 600; font-size: 14px; color: var(--ink); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; cursor: pointer; transition: text-decoration-color .15s ease-out; }
.link-btn:hover { text-decoration-color: var(--gold-mark); }
.link-btn:focus-visible, .avatar-btn:focus-visible, .bout-row:focus-visible, .video-row:focus-visible, .icon-btn:focus-visible, .seg button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.mark .mark-ink { stroke: var(--ink); }
.mark .mark-gold { stroke: var(--gold-mark); }
.wordmark { font-family: var(--font-display); font-stretch: 125%; font-weight: 900; text-transform: uppercase; letter-spacing: 0.02em; font-size: 15px; }
select { font: inherit; height: 44px; padding: 0 var(--space-3); border-radius: var(--radius-sm); border: var(--stroke-hairline) solid var(--line); background: var(--surface); color: var(--ink); }

/* demo bar */
.shell { min-height: 100%; display: grid; grid-template-rows: auto 1fr; }
.demobar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-4); padding-block: var(--space-2); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--surface); border-bottom: var(--stroke-hairline) solid var(--line); }
.demobar-brand { display: flex; align-items: center; gap: var(--space-2); margin-right: auto; }
.demobar-tag { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); padding: 2px 6px; border: var(--stroke-hairline) solid var(--line); border-radius: var(--radius-xs); }
.demobar-select { display: flex; align-items: center; gap: var(--space-2); font-size: 13px; color: var(--ink-muted); }
.demobar-select select { height: 32px; font-size: 13px; }
.demobar-date { font-family: var(--font-mono); font-size: 12px; color: var(--ink-muted); }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface-sunken); border-radius: var(--radius-sm); max-width: 100%; overflow-x: auto; }
.seg button { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; border: 0; background: none; padding: 6px 14px; transition: background .15s ease-out, color .15s ease-out; border-radius: var(--radius-xs); font-size: 13px; font-weight: 600; color: var(--ink-muted); cursor: pointer; white-space: nowrap; }
.seg button.on { background: var(--ink); color: var(--on-ink); }
.seg-count { font-family: var(--font-mono); font-size: 11px; padding: 0 5px; border-radius: var(--radius-full); background: var(--gold-mark); color: #0f1214; }

/* athlete phone */
.stage { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: var(--space-6) var(--space-12); }
.phone { position: relative; width: 100%; max-width: 440px; margin: 0 auto; background: var(--canvas); border: var(--stroke-hairline) solid var(--line); border-radius: 20px; box-shadow: var(--shadow-lg); display: grid; grid-template-rows: 1fr auto; min-height: 640px; }
.phone-screen { padding: var(--space-5) var(--space-4) var(--space-8); }
.phone-nav { position: sticky; bottom: 0; z-index: 5; border-radius: 0 0 20px 20px; }
@media (max-width: 520px) {
  .stage { padding-left: 0; padding-right: 0; padding-top: 0; padding-bottom: 0; }
  .phone { max-width: none; border: 0; border-radius: 0; box-shadow: none; min-height: calc(100vh - 56px); }
  .phone-screen { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .phone-nav { padding-bottom: env(safe-area-inset-bottom, 0px); border-radius: 0; }
}
.scr-head { display: flex; justify-content: space-between; align-items: end; gap: var(--space-3); }
.scr-head-text { display: grid; gap: var(--space-1); }
.home-head { display: flex; align-items: center; gap: var(--space-3); }
.home-hello { display: grid; gap: 2px; margin-right: auto; min-width: 0; }
.avatar-btn { flex: none; width: 48px; height: 48px; border-radius: var(--radius-full); border: 0; background: var(--ink); color: var(--on-ink); font-family: var(--font-display); font-stretch: 125%; font-weight: 800; font-size: 15px; cursor: pointer; }
.card { display: grid; gap: var(--space-3); padding: var(--space-4); background: var(--surface); border: var(--stroke-hairline) solid var(--line); border-radius: var(--radius-md); min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: start; gap: var(--space-3); flex-wrap: wrap; }
.note { display: flex; gap: var(--space-2); align-items: flex-start; font-size: 14px; line-height: 20px; color: var(--ink-muted); padding: var(--space-3); background: var(--surface-sunken); border-radius: var(--radius-sm); }
.note .tr-icon { margin-top: 2px; }
.note.warn { background: var(--stop-soft); color: var(--stop); }
.next-event { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); }
.countdown { display: grid; justify-items: center; padding: var(--space-2) var(--space-3); border: var(--stroke-rule) solid var(--rule); border-radius: var(--radius-sm); }
.countdown-num { font-family: var(--font-mono); font-size: 28px; line-height: 30px; font-weight: 600; font-variant-numeric: tabular-nums; }
.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-3); }
.feed li { display: flex; gap: var(--space-3); align-items: flex-start; font-size: 14px; line-height: 20px; }
.feed-icon { flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: var(--radius-full); background: var(--surface-sunken); color: var(--ink-muted); }
.feed-verified { background: var(--gold-soft); color: var(--gold); }
.feed-medical { background: var(--cleared-soft); color: var(--cleared); }
.feed-result { background: var(--surface-sunken); color: var(--ink); }
.skills { display: grid; gap: var(--space-5); }
.skill-row { display: grid; gap: var(--space-2); justify-items: start; }
.skill-row > .tr-skill { width: 100%; }
.record-hero { justify-items: start; }
.bouts { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-2); }
.bout-row { width: 100%; display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3); text-align: left; background: var(--surface); border: var(--stroke-hairline) solid var(--line); border-radius: var(--radius-md); cursor: pointer; }
.bout-row:hover { background: var(--surface-sunken); }
.bout-main { display: grid; gap: 2px; margin-right: auto; min-width: 0; }
.bout-opp { font-weight: 600; }
.res { flex: none; display: grid; place-items: center; width: 32px; height: 32px; border-radius: var(--radius-sm); font-family: var(--font-mono); font-weight: 600; }
.res-win { background: var(--ink); color: var(--on-ink); }
.res-loss { background: var(--surface-sunken); color: var(--ink); border: var(--stroke-hairline) solid var(--line); }
.res-draw { background: var(--surface); color: var(--ink-muted); border: var(--stroke-hairline) dashed var(--ink-faint); }
.corner-dot { flex: none; width: 10px; height: 10px; border-radius: var(--radius-full); }
.corner-red { background: var(--corner-red); }
.corner-blue { background: var(--corner-blue); }
.lib-locked { background: var(--canvas); }
.videos { list-style: none; margin: 0; padding: 0; display: grid; }
.video-row { width: 100%; display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) 0; border: 0; border-top: var(--stroke-hairline) solid var(--line); background: none; text-align: left; cursor: pointer; }
.video-row:disabled { cursor: not-allowed; color: var(--ink-muted); }
.video-play { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: var(--radius-sm); background: var(--surface-sunken); }
.video-title { margin-right: auto; font-size: 15px; line-height: 20px; min-width: 0; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-2); }
.checks li { display: flex; gap: var(--space-2); align-items: flex-start; font-size: 14px; line-height: 20px; padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); }
.checks li.ok { background: var(--cleared-soft); color: var(--cleared); }
.checks li.no { background: var(--stop-soft); color: var(--stop); }
.about { padding: 0 var(--space-1); }
.export { margin: 0; max-height: 50vh; overflow: auto; padding: var(--space-3); background: var(--surface-sunken); border-radius: var(--radius-sm); font-family: var(--font-mono); font-size: 12px; line-height: 18px; white-space: pre; }

/* share card: always the dark theme */
.share-card { display: grid; gap: var(--space-3); padding: var(--space-6); border-radius: var(--radius-md); background: var(--canvas); color: var(--ink); border-top: var(--stroke-heavy) solid var(--gold-mark); }
.share-top { display: flex; align-items: center; gap: var(--space-2); }
.share-kicker { color: var(--gold); }
.share-name { font-weight: 900; font-size: 40px; line-height: 38px; overflow-wrap: anywhere; }
.share-sub { color: var(--ink-muted); font-size: 14px; }
.share-rec { padding-top: var(--space-3); border-top: var(--stroke-hairline) solid var(--line); }
.share-url { color: var(--ink-muted); }

/* sheets */
.sheet-scrim { position: fixed; inset: 0; z-index: 50; display: grid; place-items: end center; background: #0f1214a6; padding-top: max(24px, env(safe-area-inset-top, 0px)); }
.sheet { width: 100%; max-width: 520px; max-height: 88vh; overflow: auto; background: var(--surface); color: var(--ink); border-radius: var(--radius-md) var(--radius-md) 0 0; box-shadow: var(--shadow-lg); padding-bottom: env(safe-area-inset-bottom, 0px); outline: none; }
.sheet-wide { max-width: 680px; }
@media (min-width: 720px) { .sheet-scrim { place-items: center; } .sheet { border-radius: var(--radius-md); } }
.sheet-head { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); padding: var(--space-4) var(--space-5); background: var(--surface); border-bottom: var(--stroke-hairline) solid var(--line); z-index: 1; }
.sheet-title { font-family: var(--font-display); font-stretch: 125%; font-weight: 800; text-transform: uppercase; font-size: 18px; line-height: 22px; }
.sheet-body { display: grid; gap: var(--space-4); padding: var(--space-5); }
.icon-btn { flex: none; width: 36px; height: 36px; border-radius: var(--radius-full); border: var(--stroke-hairline) solid var(--line); background: var(--surface); cursor: pointer; }
.form { display: grid; gap: var(--space-4); }
.check-line { display: flex; gap: var(--space-3); align-items: flex-start; font-size: 15px; line-height: 22px; }
.check-line input { width: 20px; height: 20px; margin-top: 1px; accent-color: var(--ink); flex: none; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--space-1); font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); }
.steps li { display: grid; gap: 6px; min-width: 0; overflow-wrap: anywhere; }
.steps span { height: 4px; border-radius: var(--radius-xs); background: var(--surface-sunken); }
.steps li.done span { background: var(--ink); }
.steps li.on span { background: var(--gold-mark); }
.steps li.on { color: var(--ink); }
.steps li.skip { opacity: .4; }

/* portals */
.portal { width: 100%; max-width: 1080px; margin: 0 auto; display: grid; gap: var(--space-5); }
.portal-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: var(--space-3); }
.portal-head > div { display: grid; gap: var(--space-1); }
.portal-scope { display: flex; gap: var(--space-2); align-items: center; }
.table-wrap { overflow-x: auto; background: var(--surface); border: var(--stroke-hairline) solid var(--line); border-radius: var(--radius-md); }
.data-table { width: 100%; min-width: 880px; border-collapse: collapse; font-size: 14px; }
.data-table tbody th { min-width: 220px; }
.data-table .tr-btn, .data-table .tr-badge { white-space: nowrap; }
.data-table th, .data-table td { padding: var(--space-3) var(--space-4); text-align: left; vertical-align: middle; border-top: var(--stroke-hairline) solid var(--line); }
.data-table thead th { border-top: 0; border-bottom: var(--stroke-rule) solid var(--rule); background: var(--surface-sunken); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
.data-table tbody th { font-weight: 400; display: grid; gap: 2px; }
.cell-name { font-weight: 600; }
.requests { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-2); }
.request { grid-template-columns: auto 1fr auto auto; align-items: center; }
.request:not(:has(.request-pick)) { grid-template-columns: 1fr auto; }
.request-pick input { width: 20px; height: 20px; accent-color: var(--ink); }
.request-main { display: grid; gap: 2px; min-width: 0; }
.request-value { min-width: 120px; }
.request-value select { height: 36px; }
@media (max-width: 760px) { .request { grid-template-columns: auto 1fr; } .request-value, .request .btn-row { grid-column: 2; } }
.empty { justify-items: start; color: var(--ink-muted); }
.spar-top { max-width: 260px; }
.spar-list { list-style: none; margin: 0; padding: 0; display: grid; }
.spar-list li label { display: grid; grid-template-columns: auto 1fr; gap: 2px var(--space-3); align-items: center; padding: var(--space-3) 0; border-top: var(--stroke-hairline) solid var(--line); cursor: pointer; }
.spar-list li label .small { grid-column: 2; }
.spar-list li input { width: 20px; height: 20px; accent-color: var(--ink); grid-row: span 2; }
.spar-list li.blocked label { cursor: not-allowed; }
.spar-list li.blocked .small { color: var(--stop); }
.plain { margin: 0; padding-left: var(--space-4); display: grid; gap: var(--space-2); font-size: 14px; }
.bout-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: var(--space-5); align-items: start; }
@media (max-width: 860px) { .bout-grid { grid-template-columns: 1fr; } }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: var(--space-3); }
.judge-grid { display: grid; gap: var(--space-2); margin-top: var(--space-2); }
.judge-row { display: grid; grid-template-columns: 32px repeat(3, 1fr); gap: var(--space-2); align-items: center; }
.score-pair { display: flex; gap: 2px; }
.score-pair select { width: 100%; min-width: 0; height: 36px; padding: 0 4px; font-family: var(--font-mono); font-weight: 600; }
.score-pair .sc-red { color: var(--corner-red); }
.score-pair .sc-blue { color: var(--corner-blue); }
.med-pick { max-width: 320px; }
.med-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: var(--space-4); align-items: start; }

/* toast */
.toast-zone { position: fixed; left: 0; right: 0; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); display: grid; place-items: center; pointer-events: none; z-index: 60; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.toast { max-width: 420px; padding: var(--space-3) var(--space-4); background: var(--ink); color: var(--on-ink); border-radius: var(--radius-sm); box-shadow: var(--shadow-lg); font-size: 14px; line-height: 20px; animation: toast-in .18s ease-out; }
@keyframes toast-in { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }

/* ---------- atmosphere: ruled scorecard paper behind everything ---------- */
:root { --texture: rgba(15, 18, 20, 0.045); --ring-ink: rgba(15, 18, 20, 0.08); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --texture: rgba(238, 238, 234, 0.035); --ring-ink: rgba(238, 238, 234, 0.08); } }
:root[data-theme="dark"], .theme-dark { --texture: rgba(238, 238, 234, 0.035); --ring-ink: rgba(238, 238, 234, 0.08); }
.stage { background-image: repeating-linear-gradient(180deg, transparent 0 31px, var(--texture) 31px 32px); }

/* ---------- stage: phone + guided demo side by side on wide screens ---------- */
.stage { display: grid; justify-content: center; gap: var(--space-12); align-items: start; }
.stage-main { min-width: 0; width: 100%; }
.stage-coach, .stage-official { grid-template-columns: minmax(0, 1080px); }
.stage-athlete { grid-template-columns: minmax(0, 440px); }
.stage-guide { display: none; }
@media (min-width: 1040px) {
  .stage-athlete { grid-template-columns: 440px 340px; }
  .stage-guide { display: block; position: sticky; top: calc(88px + env(safe-area-inset-top, 0px)); }
}

/* ---------- demo bar: always the dark broadcast strip ---------- */
.demobar { background: var(--surface); color: var(--ink); border-bottom-color: var(--line); }
.demobar .link-btn { min-height: 32px; font-size: 13px; color: var(--ink); }
.demobar .mark .mark-ink { stroke: var(--ink); }
@media (max-width: 640px) {
  .demobar-tag, .demobar-date { display: none; }
  .demobar { position: relative; top: 0; gap: var(--space-2) var(--space-3); }
  .demobar-brand { flex: 1 0 100%; }
  .demobar-select > span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .demobar-select select { max-width: 150px; }
}

/* ---------- home: the fight-card header ---------- */
.hero-card { position: relative; overflow: hidden; display: grid; gap: var(--space-4); padding: var(--space-5) var(--space-5) var(--space-5); border-radius: 14px; background: var(--canvas); color: var(--ink); background-image: repeating-linear-gradient(180deg, transparent 0 31px, var(--texture) 31px 32px); box-shadow: var(--shadow-lg); }
.hero-card .tr-label { color: var(--ink-muted); position: relative; }
.hero-ring { position: absolute; right: -72px; top: -64px; width: 280px; height: 280px; fill: none; stroke-width: 7; pointer-events: none; }
.hero-ring .ring-a { stroke: var(--ring-ink); }
.hero-ring .ring-b { stroke: var(--gold-mark); opacity: .55; }
.hero-top { position: relative; display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); }
.hero-card .avatar-btn { background: var(--ink); color: var(--on-ink); }
.hero-name { position: relative; margin: 0; font-weight: 900; font-size: 44px; line-height: 40px; letter-spacing: -0.015em; overflow-wrap: anywhere; }
.hero-stats { position: relative; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: var(--space-4); padding-top: var(--space-4); border-top: var(--stroke-hairline) solid var(--line); }
.hero-card .tr-record-num { color: var(--ink); }
.hero-level { display: grid; justify-items: end; gap: 2px; }
.hero-level-name { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-display); font-stretch: 125%; font-weight: 800; text-transform: uppercase; font-size: 18px; color: var(--gold); }
@media (prefers-reduced-motion: no-preference) {
  .hero-ring { animation: ring-in .9s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes ring-in { from { opacity: 0; transform: rotate(-40deg) scale(.9); } to { opacity: 1; transform: none; } }
}

/* ---------- guided demo ---------- */
.guide { display: grid; gap: var(--space-3); padding: var(--space-5); background: var(--surface); border: var(--stroke-hairline) solid var(--line); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); }
.sheet .guide { padding: 0; border: 0; box-shadow: none; background: none; }
.guide-kicker { color: var(--gold); }
.guide-title { margin: 0; font-weight: 900; font-size: 28px; line-height: 28px; }
.guide-steps { list-style: none; margin: var(--space-2) 0 0; padding: 0; display: grid; gap: 0; counter-reset: none; }
.guide-steps li { display: grid; grid-template-columns: 32px 1fr; gap: var(--space-3); padding: var(--space-3) 0; border-top: var(--stroke-hairline) solid var(--line); }
.guide-n { display: grid; place-items: center; width: 28px; height: 28px; border-radius: var(--radius-full); border: var(--stroke-rule) solid var(--rule); font-family: var(--font-mono); font-size: 13px; font-weight: 600; }
.guide-steps li.here .guide-n { background: var(--gold-mark); border-color: var(--gold-mark); color: #0f1214; }
.guide-body { display: grid; gap: 2px; min-width: 0; justify-items: start; }
.guide-step { margin: 0; font-weight: 600; font-size: 15px; line-height: 20px; }
.guide .link-btn { min-height: 36px; font-size: 13px; }

/* ---------- coach summary tiles ---------- */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-3); }
@media (max-width: 720px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { display: grid; gap: var(--space-1); justify-items: start; padding: var(--space-4) var(--space-5); background: var(--surface); border: var(--stroke-hairline) solid var(--line); border-radius: var(--radius-md); text-align: left; cursor: pointer; transition: border-color .15s ease-out, transform .15s ease-out; }
.tile:hover { border-color: var(--rule); }
.tile:active { transform: scale(.98); }
.tile:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.tile-num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 36px; line-height: 40px; font-weight: 600; }
.tile-caution .tile-num { color: var(--caution); }
.tile-stop .tile-num { color: var(--stop); }
.live-dot { display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: var(--radius-full); background: var(--gold-mark); vertical-align: 1px; }

/* ---------- toasts carry what happened ---------- */
.toast { display: flex; align-items: center; gap: var(--space-3); }
.toast-icon { flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: var(--radius-full); background: var(--on-ink); color: var(--ink); }
.toast-verified .toast-icon { background: var(--gold-mark); color: #0f1214; }
.toast-cleared .toast-icon { background: var(--cleared-soft); color: var(--cleared); }
.toast-stop .toast-icon { background: var(--stop-soft); color: var(--stop); }

/* ---------- motion: each screen arrives in order, once ---------- */
@media (prefers-reduced-motion: no-preference) {
  .phone-screen > .stack > *, .portal > * { animation: tr-rise .42s cubic-bezier(.2, .8, .2, 1) both; }
  .phone-screen > .stack > :nth-child(2), .portal > :nth-child(2) { animation-delay: .05s; }
  .phone-screen > .stack > :nth-child(3), .portal > :nth-child(3) { animation-delay: .1s; }
  .phone-screen > .stack > :nth-child(4), .portal > :nth-child(4) { animation-delay: .15s; }
  .phone-screen > .stack > :nth-child(5), .portal > :nth-child(5) { animation-delay: .2s; }
  .phone-screen > .stack > :nth-child(n+6) { animation-delay: .25s; }
  .bout-row, .video-row { transition: background .15s ease-out, transform .15s ease-out; }
  .bout-row:active { transform: scale(.99); }
  .sheet { animation: sheet-in .28s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes sheet-in { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
}

</style>
</head>

  function Signup(props) {

      var id = (f.first + '-' + f.last).toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-' + uid().slice(0, 3);

        guardian: minor ? { name: f.gName, email: f.gEmail, consentOn: TODAY } : undefined, clearance: null, suspension: null,
        privacy: { publicPage: !minor && f.publicPage, shareCards: !minor && f.shareCards, marketing: f.marketing }, skills: sk, unlocked: [0], watched: [] } }, 'Welcome to TrueRound, ' + f.first.trim() + '.');
      props.close();
    }
    var valid = [f.first.trim() && f.last.trim() && /.+@.+\..+/.test(f.email), years !== null && !tooYoung && years < 100, f.gName.trim() && /.+@.+\..+/.test(f.gEmail) && f.gConsent, true, true][step];

      ${years !== null && !tooYoung ? html`<p className="note">${minor ? html`<${Icon} name="shield" size=${16} /> You're ${years}. A parent or guardian creates and manages your account, and your profile stays private.` : html`<${Icon} name="check" size=${16} /> You're ${years}. You manage your own account.`}</p>` : null}</div>`;
    else if (step === 2) body = html`<div className="form"><p className="muted">Under-18 accounts are created through a parent or guardian, who can view, export or delete the data at any time.</p>

        <section className="card form"><h2 className="title">Record a pre-competition medical</h2>
          <${Field} id="md-until" label="Cleared to compete until" type="date" value=${until} min=${TODAY} onChange=${function (e) { setUntil(e.target.value); }} />
          <${Button} variant="primary" icon="shield" onClick=${function () { act({ type: 'clear', athlete: a.id, until: until, by: by }, nameOf(a) + ' cleared until ' + fmt(until) + '.', 'cleared'); }}>Record clearance<//></section>
        <section className="card form"><h2 className="title">Issue a suspension</h2>
          <${Field} id="md-susp" label="No contact until" type="date" value=${suspUntil} min=${TODAY} onChange=${function (e) { setSuspUntil(e.target.value); }} />
          <div className="tr-field"><label htmlFor="md-reason">Category</label><select id="md-reason" value=${reason} onChange=${function (e) { setReason(e.target.value); }}>
            <option>Mandatory rest after a stoppage</option><option>Event doctor's decision</option></select></div>
          <${Button} variant="danger" icon="ban" onClick=${function () { act({ type: 'suspend', athlete: a.id, until: suspUntil, reason: reason, by: by }, nameOf(a) + ' suspended until ' + fmt(suspUntil) + '. Their coach sees it now.', 'stop'); }}>Issue suspension<//></section>
      </div></div>`;
  }

  /* ---------- guided demo ---------- */
  var GUIDE = [
    { role: 'athlete', tab: 'pathway', title: 'Ask for a check', text: 'As Layla, open Pathway and tap “Ask coach to check” on any skill below 100%.' },
    { role: 'coach', tab: 'verify', title: 'Verify it as the coach', text: 'The request is waiting for Coach Karim Nassar. Pick a level and verify it.' },
    { role: 'official', tab: 'bout', title: 'Sign a bout sheet', text: 'Score three rounds as the officials. Signing writes the result to the athlete’s record.' },
    { role: 'official', tab: 'medical', title: 'Issue a suspension', text: 'Record a post-stoppage suspension. The coach’s sparring plan blocks that athlete at once.' },
    { role: 'athlete', tab: 'events', title: 'Check eligibility', text: 'Back as an athlete, try to register. Medical, suspension and level decide, not a form.' }
  ];
  function Guide(props) {
    return html`<div className="guide">
      <p className="tr-label guide-kicker">Guided demo · 2 minutes</p>
      <h2 className="guide-title tr-display">One record,<br/>three roles</h2>
      <p className="small muted">Every change you make here appears for the other roles straight away.</p>
      <ol className="guide-steps">${GUIDE.map(function (g, i) {
        var here = props.role === g.role && props.tab === g.tab;
        return html`<li key=${g.title} className=${here ? 'here' : ''}>
          <span className="guide-n" aria-hidden="true">${i + 1}</span>
          <div className="guide-body"><p className="guide-step">${g.title}</p><p className="small muted">${g.text}</p>
            <button type="button" className="link-btn" onClick=${function () { props.go(g.role, g.tab); }}>${here ? 'You are here' : 'Go there'} →</button></div>
        </li>`;
      })}</ol>
      <p className="small muted">Changes stay in this browser. “Reset demo” restores the starting data.</p>
    </div>`;
  }

  var TOAST_ICON = { verified: 'check', stop: 'ban', cleared: 'shield' };

  /* ---------- root ---------- */
  function App() {
    var st = useReducer(reducer, null, load), s = st[0], dispatch = st[1];
    var ts = useState(null), toast = ts[0], setToast = ts[1];
    var ns = useState({ athlete: 'home', coach: 'roster', official: 'bout' }), nav = ns[0], setNav = ns[1];
    var gs = useState(false), guideOpen = gs[0], setGuideOpen = gs[1];
    var timer = useRef(null);
    useEffect(function () { try { window.localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) { /* storage blocked */ } }, [s]);
    function act(a, msg, kind) {
      if (a.type !== 'noop') dispatch(a);
      if (msg) { setToast({ msg: msg, kind: kind || '' }); clearTimeout(timer.current); timer.current = setTimeout(function () { setToast(null); }, 4000); }
    }
    function setTab(role) { return function (t) { setNav(function (cur) { var o = Object.assign({}, cur); o[role] = t; return o; }); }; }
    function go(role, tab) {
      if (role !== s.role) dispatch({ type: 'role', role: role });
      setTab(role)(tab); setGuideOpen(false); window.scrollTo(0, 0);
    }
    var view = s.role === 'coach' ? html`<${CoachPortal} s=${s} act=${act} tab=${nav.coach} setTab=${setTab('coach')} />`
      : s.role === 'official' ? html`<${OfficialDesk} s=${s} act=${act} tab=${nav.official} setTab=${setTab('official')} />`
      : html`<${AthleteApp} s=${s} act=${act} tab=${nav.athlete} setTab=${setTab('athlete')} />`;
    return html`<div className="shell">
      <${DemoBar} s=${s} act=${act} openGuide=${function () { setGuideOpen(true); }} />
      <div className=${'stage stage-' + s.role}>
        <div className="stage-main">${view}</div>
        ${s.role === 'athlete' ? html`<aside className="stage-guide" aria-label="Guided demo"><${Guide} role=${s.role} tab=${nav[s.role]} go=${go} /></aside>` : null}
      </div>
      ${guideOpen ? html`<${Sheet} title="How to demo" onClose=${function () { setGuideOpen(false); }}><${Guide} role=${s.role} tab=${nav[s.role]} go=${go} /><//>` : null}
      <div className="toast-zone" aria-live="polite">${toast ? html`<div className=${'toast toast-' + (toast.kind || 'plain')} role="status">
        ${TOAST_ICON[toast.kind] ? html`<span className="toast-icon"><${Icon} name=${TOAST_ICON[toast.kind]} size=${16} strokeWidth=${3} /></span>` : null}${toast.msg}</div>` : null}</div>
    </div>`;
  }

  ReactDOM.createRoot(document.getElementById('app')).render(h(App));
})();

</script>
</body>
</html>
